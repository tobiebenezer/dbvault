openapi: 3.1.0
info:
  title: DBVault Control Plane API
  version: 0.7.0
servers:
  - url: https://dbvault.example.com
paths:
  /v1/organisations:
    post:
      summary: Create an organisation
      responses: {'201': {description: Created}}
  /v1/projects:
    post:
      summary: Create a tenant-scoped project
      responses: {'201': {description: Created}}
  /v1/agents/register:
    post:
      summary: Register an agent identity
      responses: {'201': {description: Registered}}
  /v1/agents/heartbeat:
    post:
      summary: Report agent health
      responses: {'200': {description: Online}}
  /v1/sources:
    get:
      summary: List sources in the tenant scope
      responses: {'200': {description: Source list}}
    post:
      summary: Register a source
      responses: {'201': {description: Registered}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
security: [{bearerAuth: []}]
