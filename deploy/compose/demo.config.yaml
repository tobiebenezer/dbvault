version: 1

server:
  data_directory: /var/lib/dbvault
  scratch_directory: /var/lib/dbvault/scratch
  log_spool_directory: /var/lib/dbvault/log-spool
  listen: 0.0.0.0:8080

catalogue:
  driver: sqlite
  path: /var/lib/dbvault/catalogue/dbvault.sqlite

secret_providers:
  - id: local-files
    driver: file
    file:
      root: /var/lib/dbvault/keys

metrics:
  enabled: true
  path: /metrics

doctor:
  min_free_bytes: 268435456 # 256 MiB floor for the demo appliance

destinations:
  - id: demo-local
    driver: filesystem
    filesystem:
      root: /var/lib/dbvault/repository

repositories:
  - id: demo
    mode: single
    primary:
      destination: demo-local
    encryption:
      key_provider: local-files
      active_key: demo-key
    signing:
      key_provider: local-files
      key_id: signing-local
    compression:
      algorithm: zstd
      level: 6
      minimum_savings_percent: 5
    chunking:
      sqlite:
        strategy: page-aligned
        target_size: 64KiB
    retention:
      keep_last: 7
      daily: 7
      weekly: 4
      monthly: 3
      minimum_verified_snapshots: 1
      gc_sweep_interval: 6h

sources:
  - id: demo-sqlite
    engine: sqlite
    repository: demo
    enabled: true
    sqlite:
      path: /var/lib/dbvault/demo.db
