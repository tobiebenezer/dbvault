services:
  minio-primary:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: primary-access
      MINIO_ROOT_PASSWORD: primary-secret-password
    ports: ['9000:9000', '9001:9001']
  minio-replica:
    image: minio/minio:latest
    command: server /data --console-address ':9101'
    environment:
      MINIO_ROOT_USER: replica-access
      MINIO_ROOT_PASSWORD: replica-secret-password
    ports: ['9100:9000', '9101:9001']
  webhook-receiver:
    image: mendhak/http-https-echo:35
    ports: ['8088:8080']
  smtp-test:
    image: mailhog/mailhog:v1.0.1
    ports: ['1025:1025', '8025:8025']
