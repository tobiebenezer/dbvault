services:
  controller:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["dbvault-controller", "--listen", ":8081", "--token", "integration-token"]
    ports: ["18081:8081"]
  agent-a:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["dbvault-agent", "--controller", "http://controller:8081", "--organisation", "org-a", "--project", "project-a", "--agent-id", "agent-a", "--token", "integration-token"]
    depends_on: [controller]
  agent-b:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["dbvault-agent", "--controller", "http://controller:8081", "--organisation", "org-b", "--project", "project-b", "--agent-id", "agent-b", "--token", "integration-token"]
    depends_on: [controller]
  minio-a:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: orga, MINIO_ROOT_PASSWORD: orga-secret}
  minio-b:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: orgb, MINIO_ROOT_PASSWORD: orgb-secret}
