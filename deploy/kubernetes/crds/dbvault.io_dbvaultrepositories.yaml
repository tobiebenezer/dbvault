apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dbvaultrepositories.dbvault.io
spec:
  group: dbvault.io
  scope: Namespaced
  names:
    plural: dbvaultrepositories
    singular: dbvaultrepository
    kind: DBVaultRepository
    shortNames: [dbvrepo]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [mode, encryption]
              properties:
                mode: {type: string, enum: [single, primaryReplica, mirror]}
                primary:
                  type: object
                  properties:
                    destinationRef:
                      type: object
                      properties:
                        name: {type: string}
                      required: [name]
                replicas:
                  type: array
                  items:
                    type: object
                    properties:
                      destinationRef:
                        type: object
                        properties:
                          name: {type: string}
                        required: [name]
                      requiredWithin: {type: string}
                encryption:
                  type: object
                  required: [keySecretRef]
                  properties:
                    keySecretRef:
                      type: object
                      required: [name, key]
                      properties:
                        name: {type: string}
                        key: {type: string}
                retention:
                  type: object
                  properties:
                    keepLast: {type: integer, minimum: 2}
                    daily: {type: integer, minimum: 0}
                    weekly: {type: integer, minimum: 0}
                    monthly: {type: integer, minimum: 0}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
